
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="View our document online.">

    <title>Santé Mentale</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #ffffff;
            overflow: hidden;
        }

        .pdf-container {
            width: 100%;
            height: 100%;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            background: #ffffff;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 100%;
            border: none;
            background: #ffffff;
        }

        @media (max-width: 768px) {
            iframe {
                width: 100%;
                height: 100%;
                min-height: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="pdf-container">
        <iframe
            src="./document.pdf#view=FitH"
            title="Santé Mentale"
            loading="eager"
            allow="fullscreen">
        </iframe>
    </main>

</body>
</html>
